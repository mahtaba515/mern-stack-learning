<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailValidation</title>
</head>

<body>
    <header>
        <h2>Contact Us</h2>
    </header>
    <form action="">
        <label for="name">Name:</label><br>
        <input type="text" name="name" id="name">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" placeholder="enter your mail here">
        <br><br>


        <label for="phone">Phone:</label><br>
        <input type="tel" name="phone" id="phone" placeholder="Enter 10 digit phone number" maxlength="10" pattern="[0-9]{10}" required>
        <br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message"></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>





</body>

</html>
